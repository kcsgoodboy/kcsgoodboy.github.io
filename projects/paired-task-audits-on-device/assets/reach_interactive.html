<script>
(function () {
  var data = JSON.parse(document.getElementById('reach-data').textContent);
  var top = document.querySelector('.reach-top'), dist = document.querySelector('.reach-dist');
  if (!top || !dist) return;
  var frame = data.frame_cm, S = top.viewBox.baseVal.width, scale = (S / 2 - 52) / frame, cx = S / 2;
  var W = dist.viewBox.baseVal.width, H = dist.viewBox.baseVal.height, x0 = 80, x1 = W - 20, y0 = 50, y1 = H - 60, dmax = 40;
  function tx(v) { return cx + v * scale; } function ty(v) { return cx - v * scale; }
  function sx(i) { return x0 + (x1 - x0) * i / data.horizon; } function sy(d) { return y1 - (y1 - y0) * Math.min(d, dmax) / dmax; }
  var paths = {}, heads = {}, dists = {};
  top.querySelectorAll('polyline.path').forEach(function (el) { paths[el.classList[1] + ':' + el.dataset.seed] = el; });
  top.querySelectorAll('circle.head').forEach(function (el) { heads[el.classList[1] + ':' + el.dataset.seed] = el; });
  dist.querySelectorAll('polyline.dist').forEach(function (el) { dists[el.classList[1] + ':' + el.dataset.seed] = el; });
  var cursor = dist.querySelector('.cursor');
  var slider = document.getElementById('step'), label = document.getElementById('stepLabel'), play = document.getElementById('play'), failOnly = document.getElementById('failOnly');
  function render(k) {
    ['fp32', 'device'].forEach(function (arm) {
      data.seeds.forEach(function (seed) {
        var ep = data[arm][seed], key = arm + ':' + seed, hide = failOnly.checked && data.device_success[seed];
        var pts = [];
        for (var i = 0; i <= k; i++) pts.push(tx(ep.xy[i][0]).toFixed(1) + ',' + ty(ep.xy[i][1]).toFixed(1));
        paths[key].setAttribute('points', pts.join(' ')); paths[key].style.display = hide ? 'none' : '';
        heads[key].setAttribute('cx', tx(ep.xy[k][0])); heads[key].setAttribute('cy', ty(ep.xy[k][1])); heads[key].style.display = hide ? 'none' : '';
        var dp = [];
        for (var j = 0; j <= k; j++) dp.push(sx(j).toFixed(1) + ',' + sy(ep.d[j]).toFixed(1));
        dists[key].setAttribute('points', dp.join(' ')); dists[key].style.display = hide ? 'none' : '';
      });
    });
    cursor.setAttribute('x1', sx(k)); cursor.setAttribute('x2', sx(k)); cursor.style.opacity = k < data.horizon ? 1 : 0;
    label.textContent = 'step ' + k;
  }
  var timer = null;
  function stop() { if (timer) { clearInterval(timer); timer = null; } play.innerHTML = '&#9654; Play'; }
  play.addEventListener('click', function () {
    if (timer) { stop(); return; }
    var k = +slider.value >= data.horizon ? 0 : +slider.value;
    play.textContent = 'Pause';
    timer = setInterval(function () { k += 1; slider.value = k; render(k); if (k >= data.horizon) stop(); }, 140);
  });
  slider.addEventListener('input', function () { stop(); render(+slider.value); });
  failOnly.addEventListener('change', function () { render(+slider.value); });
})();
