# options specified here will apply to all posts in this folder

# Enable banner style title blocks
title-block-banner: true

# Enable CC licence appendix
license: "CC BY"

# Default for table of contents
toc: true
toc-location: left
toc-title: "On this page"

# freeze computational output
execute:
  freeze: auto
  echo: true
  message: true
  warning: true

# Default format
format: 
  html: 
    lib-dir: /site_libs
  pdf: 
    pdf-engine: xelatex
    mainfont: "Noto Serif CJK KR"
    lang: ko
    fontsize: 12pt
  ipynb: default

# Default language
lang: en