# options specified here will apply to all posts in this folder

# Enable banner style title blocks
title-block-banner: true

# Default author
author:
  - name: Chanseok Kang
    url: https://kcsgoodboy.github.io
    affiliation: LG Electronics
    affiliation-url: https://www.lge.co.kr/

# Enable CC licence appendix
license: "CC BY"

# Default for table of contents
toc: true
toc-location: left
toc-title: Table of contents

# freeze computational output
execute:
  freeze: auto
  echo: true
  message: true
  warning: true

# Default format
format: 
  html: 
    lib-dir: /site_libs
  pdf: 
    pdf-engine: xelatex
    mainfont: "Noto Serif CJK KR"
    lang: ko
    fontsize: 12pt
  ipynb: default

comments:
  giscus:
    repo: kcsgoodboy/kcsgoodboy.github.io
    repo-id: R_kgDOPRiawA
    mapping: pathname
    category: General
    category-id: DIC_kwDOPRiawM4CtfeS
    reactions-enabled: true
    input-position: bottom
    theme: 
      light: light
      dark: dark_dimmed
    loading: lazy

# Default language
lang: en