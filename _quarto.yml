website:
  title: "kcsgoodboy.github.io"
  page-footer:
    left: "© 2023 kcsgoodboy"
    right: "Built with Quarto"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: About
        href: about.qmd
      - text: Posts
        href: posts/index.qmd
      - text: Publications
        href: publications/index.qmd
