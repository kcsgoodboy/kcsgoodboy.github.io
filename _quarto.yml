project:
  type: website
  resources:
    - "contents/files/*.pdf"

execute:
  freeze: auto

website:
  site-url: https://kcsgoodboy.github.io/
  repo-url: https://github.com/kcsgoodboy/kcsgoodboy.github.io
  title: "Chan's Research Note"
  description: "A practitioner - scholar's research note on AI, Reinforcement Learning, and On-Device AI. Sharing insights from experiments, applications, and theories."
  page-navigation: true
  bread-crumbs: true
  open-graph:
    image: contents/images/persona.png
  twitter-card:
    image: contents/images/persona.png
    card-style: summary_large_image
  navbar:
    background: dark
    right: []
  page-footer:
    left: "© 2026 Chanseok Kang · Ascent of Applied Wisdom"
    right:
      - icon: github
        href: https://github.com/goodboychan
      - icon: linkedin
        href: https://www.linkedin.com/in/chanseokk/
  google-analytics: "G-0JHM3R8BEZ"
  search:
    location: navbar
    type: overlay
    copy-button: true

format:
  html:
    theme:
      light: [flatly, assets/css/theme-light.scss]
      dark:  [darkly, assets/css/theme-dark.scss]
    css:  
      - assets/css/styles.css            
    toc: true
    lightbox:
      match: auto
      effect: fade
      desc-position: bottom
    comments:
      giscus:
        repo: kcsgoodboy/kcsgoodboy.github.io
        repo-id: R_kgDOPRiawA
        category: General
        category-id: DIC_kwDOPRiawM4CtfeS
        mapping: pathname
        reactions-enabled: true
        input-position: bottom
        language: en
    include-in-header: header.html

