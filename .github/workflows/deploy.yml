name: Build & Deploy multilingual site
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Install R package deps
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libfribidi-dev libharfbuzz-dev libxslt1-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.0"

      - name: Restore R library via renv
        if: ${{ hashFiles('renv.lock') != '' }}
        uses: r-lib/actions/setup-renv@v2   # renv 캐시 + 복원

      - name: Install distilltools
        if: ${{ hashFiles('renv.lock') == '' }}
        run: Rscript -e "install.packages('distill', repos = c('https://ropensci.r-universe.dev', 'https://cloud.r-project.org'))"

      - name: Install babelquarto (no renv.lock)
        if: ${{ hashFiles('renv.lock') == '' }}
        run: Rscript -e "install.packages('babelquarto', repos = c('https://ropensci.r-universe.dev', 'https://cloud.r-project.org'))"

      - name: Render book
        run: Rscript -e 'babelquarto::render_website()'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
