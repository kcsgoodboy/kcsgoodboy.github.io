name: Deploy Quarto Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Clean docs directory
        run: rm -rf docs

      - name: Render Korean site
        run: quarto render --profile ko

      - name: Render English site
        run: quarto render --profile en

      - name: Create redirect index.html
        run: echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=./ko/"></head><body></body></html>' > docs/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4