name: Build & Deploy multilingual site
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: github-pages

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto & TinyTex
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
        
      - name: setup Python
        run: |
          python -m pip install nbformat nbclient ipykernel jupyter numpy scipy matplotlib

      - name: Install R package deps
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libfribidi-dev libharfbuzz-dev libxslt1-dev
          sudo apt-get install -y fonts-noto-cjk texlive-extra-utils

      - name: Install R
        uses: r-lib/actions/setup-r@v2

      - name: Restore R library via renv
        if: ${{ hashFiles('renv.lock') != '' }}
        uses: r-lib/actions/setup-renv@v2   # renv 캐시 + 복원

      - name: Init tlmgr
        run: |
          tlmgr --version
          tlmgr init-usertree
        
      - name: Install packages for korean rendering
        if: ${{ hashFiles('renv.lock') == '' }}
        run: tlmgr install collection-langcjk xetexko luatexko nanumtype1

      - name: Install distilltools
        if: ${{ hashFiles('renv.lock') == '' }}
        run: |
          Rscript -e "install.packages('distill', repos = c('https://ropensci.r-universe.dev', 'https://cloud.r-project.org'))"
          Rscript -e "install.packages('remotes')"
          Rscript -e 'install.packages(c("remotes", "gitcreds"))'
          Rscript -e "remotes::install_github('EllaKaye/distilltools')"

      - name: Install babelquarto (no renv.lock)
        if: ${{ hashFiles('renv.lock') == '' }}
        run: Rscript -e "install.packages('babelquarto', repos = c('https://ropensci.r-universe.dev', 'https://cloud.r-project.org'))"

      - name: Render book
        run: |
          rm -rf _site docs
          git clean -fdx
          Rscript -e 'babelquarto::render_website()'
          Rscript -e 'babelquarto::render_website(profile='_quarto-ko.yml')'
          Rscript -e 'warnings()'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
