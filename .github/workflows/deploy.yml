name: Build & Deploy multilingual site
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - uses: actions/checkout@v4

      # 1) Quarto + R 설치
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
      - name: Install babelquarto
        run: Rscript -e "install.packages('babelquarto')"

      # 2) 다국어 사이트 렌더 (_site/ko, _site/en 생성)
      - name: Render multilingual site
        run: Rscript -e "babelquarto::render_website()"

      # 3) GitHub Pages artifact 업로드 & 배포
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
