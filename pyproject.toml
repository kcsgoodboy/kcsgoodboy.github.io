[project]
name = "kcsgoodboy-github-io"
version = "0.1.0"
description = "Chan's Research Note - Quarto website with AI/ML notebooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchinfo>=1.8.0",
    "qai-hub-models>=0.5.0",
    "qai-hub>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]
